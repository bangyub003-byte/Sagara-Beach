<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163828"/>
      <stop offset="50%" stop-color="#13281E"/>
      <stop offset="100%" stop-color="#0B1A13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Homestay House Silhouette with Islamic Elegance -->
  <g transform="translate(256, 235)" text-anchor="middle">
    <!-- Roof Silhouette -->
    <path d="M 0 -130 L 140 -20 L 105 -20 L 105 110 L -105 110 L -105 -20 L -140 -20 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chimney / Minaret Peak Accent -->
    <path d="M 0 -145 L 0 -120" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-155" r="9" fill="url(#accentGrad)"/>

    <!-- Inner Doorway / Arch -->
    <path d="M -45 110 L -45 25 C -45 -15, 45 -15, 45 25 L 45 110 Z" 
          fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="12"/>

    <!-- Warm Glowing Window Light -->
    <circle cx="0" cy="20" r="16" fill="url(#accentGrad)" filter="url(#glow)"/>

    <!-- Crescent Moon & Star Motif inside door -->
    <path d="M 0 50 A 14 14 0 0 0 14 68 A 12 12 0 1 1 2 52 Z" fill="#FCD34D"/>
  </g>

  <!-- Typography Brand Bar -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    GRIYA BAROKAH
  </text>
  <text x="256" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" fill="#34D399" text-anchor="middle" letter-spacing="5">
    HOMESTAY
  </text>
</svg>
